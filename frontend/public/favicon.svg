<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" fill="none">
  <!-- Fondo -->
  <rect width="180" height="180" fill="#ffffff"/>
  
  <!-- Círculo de fondo (gradiente) -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  <circle cx="90" cy="90" r="85" fill="url(#grad)"/>
  
  <!-- Casa (símbolo IoT) -->
  <g transform="translate(90, 90)">
    <!-- Techo -->
    <polygon points="-40,-20 0,-45 40,-20" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Pared -->
    <rect x="-40" y="-20" width="80" height="70" fill="none" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Puerta -->
    <rect x="-15" y="20" width="30" height="30" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="-5" cy="35" r="2" fill="#ffffff"/>
    
    <!-- Ventana izquierda -->
    <rect x="-35" y="-10" width="20" height="20" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="-25" y1="-10" x2="-25" y2="10" stroke="#ffffff" stroke-width="1"/>
    <line x1="-35" y1="0" x2="-15" y2="0" stroke="#ffffff" stroke-width="1"/>
    
    <!-- Ventana derecha -->
    <rect x="15" y="-10" width="20" height="20" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="25" y1="-10" x2="25" y2="10" stroke="#ffffff" stroke-width="1"/>
    <line x1="15" y1="0" x2="35" y2="0" stroke="#ffffff" stroke-width="1"/>
    
    <!-- Indicador WiFi (sistema conectado) -->
    <g transform="translate(0, -55)">
      <path d="M -8 0 Q -12 -8 -12 -12" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <path d="M 0 -3 Q -16 -16 -16 -20" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
      <circle cx="0" cy="2" r="2" fill="#ffffff"/>
    </g>
  </g>
</svg>
