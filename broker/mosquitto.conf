# ─────────────────────────────────────────────────────────────
#  Mosquitto Configuration — CasaIoT
#  MQTT sobre TLS únicamente. Plain MQTT deshabilitado.
# ─────────────────────────────────────────────────────────────

# ── General ──────────────────────────────────────────────────
# Log al stdout para Docker
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Persistencia de mensajes y sesiones
persistence true
persistence_location /mosquitto/data/

# ── Listener MQTT Plain (para develop y backend) ─────────────
listener 1883
allow_anonymous true
# NOTA: En desarrollo, MQTT plain accesible en la red Docker.

# ── Listener MQTT TLS (producción) ───────────────────────────
listener 8883

# Certificados del servidor
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key

# Requerir certificado de cliente (mTLS)
# Cuando require_certificate es true, cada cliente debe presentar
# un certificado firmado por nuestra CA. Esto asegura que solo
# dispositivos autorizados (ESP32 con cert) puedan conectarse.
# TEMP: Disabled for development
# require_certificate true

# El CN del certificado del cliente se usa como username MQTT.
# Esto nos permite identificar al dispositivo por su certificado.
use_identity_as_username false

# Versión TLS mínima — TLS 1.2+ únicamente
tls_version tlsv1.2

# ── Autenticación ─────────────────────────────────────────────
# Además de mTLS, validamos usuario+contraseña (doble factor)
# TEMP: Disabled for development — password_file /mosquitto/config/passwd
allow_anonymous true

# ── ACL (Access Control List) ─────────────────────────────────
# Control de qué usuario puede publicar/suscribirse a qué topics
# Formato: acl_file /mosquitto/config/acl
# Se genera dinámicamente por el backend cuando se registra un dispositivo
# TEMP: Disabled for development
# acl_file /mosquitto/config/acl

# ── Límites de seguridad ──────────────────────────────────────
# Máximo de conexiones simultáneas (escalar según dispositivos)
max_connections 200

# Limitar tamaño máximo de payload (1MB es más que suficiente para IoT)
message_size_limit 1048576

# Keepalive máximo permitido para clientes
max_keepalive 300
